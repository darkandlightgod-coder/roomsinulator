<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D 室內裝潢與系統櫃旗艦規劃系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/DragControls.js"></script>
    <style>
        :root { --scale: 2px; }
        body { margin: 0; overflow: hidden; background-color: #121212; color: #e0e0e0; font-family: 'Inter', sans-serif; touch-action: none; user-select: none; }
        
        /* 版面配置 (上下雙螢幕) */
        #app-container { display: flex; flex-direction: column; height: 100dvh; width: 100vw; position: relative; }
        #view-3d { flex: 1; min-height: 50vh; background: #0a0a0a; position: relative; z-index: 1; }
        #view-2d { flex: 1; min-height: 40vh; background-color: #1a1a1a; background-image: linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px); background-size: 20px 20px; background-position: center center; position: relative; overflow: hidden; border-top: 4px solid #3d2b1f; touch-action: none; }
        
        /* 全天候快速工具列 (固定左上角) */
        #quick-tools { position: absolute; top: 15px; left: 15px; z-index: 9999; display: flex; gap: 8px; }
        .tool-btn { background: rgba(20,20,20,0.85); color: white; border: 1px solid #555; width: 40px; height: 40px; border-radius: 8px; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(5px); box-shadow: 0 4px 6px rgba(0,0,0,0.5); transition: 0.2s; }
        .tool-btn:hover { background: #d97706; border-color: #f59e0b; }
        .tool-btn:disabled { opacity: 0.3; cursor: not-allowed; }

        /* 左側系統選單 (動態切換內容) */
        #sidebar { position: absolute; left: -320px; top: 0; height: 100%; width: 320px; background: rgba(15, 15, 15, 0.95); backdrop-filter: blur(10px); z-index: 9000; transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1); display: flex; flex-direction: column; border-right: 1px solid #444; box-shadow: 5px 0 25px rgba(0,0,0,0.8); }
        #sidebar.open { left: 0; }
        #sidebar-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.6); z-index: 8999; display: none; backdrop-filter: blur(2px); }
        #sidebar.open ~ #sidebar-overlay { display: block; }

        /* 2D 平面圖物件 */
        #floor-plan-container { position: absolute; top: 50%; left: 50%; width: 0; height: 0; transition: transform 0.2s ease-out; }
        .map-item { position: absolute; transform: translate(-50%, -50%); box-sizing: border-box; cursor: grab; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: bold; color: white; text-shadow: 1px 1px 2px black; box-shadow: 0 4px 6px rgba(0,0,0,0.5); border-radius: 2px; transition: filter 0.2s, outline 0.2s; border: 1px solid rgba(255,255,255,0.3); background-size: cover; background-position: center; }
        .map-item:hover { filter: brightness(1.2); outline: 2px solid #d97706; z-index: 20 !important; }
        
        /* 攝影機圖示 */
        #camera-marker { position: absolute; width: 30px; height: 30px; transform: translate(-50%, -50%); cursor: grab; z-index: 100; }
        #camera-marker .dot { width: 14px; height: 14px; background: #3b82f6; border-radius: 50%; margin: auto; position: absolute; top: 8px; left: 8px; box-shadow: 0 0 10px #3b82f6, inset 0 0 4px white; border: 2px solid white; }
        #camera-marker .cone { width: 0; height: 0; border-left: 20px solid transparent; border-right: 20px solid transparent; border-bottom: 40px solid rgba(59, 130, 246, 0.4); position: absolute; top: -30px; left: -5px; pointer-events: none; }

        /* 模式指示器 */
        .mode-badge { position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.85); padding: 8px 16px; border-radius: 20px; border: 1px solid #d97706; color: #d97706; font-weight: bold; z-index: 50; pointer-events: none; font-size: 13px; box-shadow: 0 0 15px rgba(217, 119, 6, 0.3); white-space: nowrap; }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #555; border-radius: 3px; }

        @media (max-width: 768px) { #sidebar { width: 85%; left: -85%; } }
    </style>
</head>
<body>
    <div id="app-container">
        
        <!-- 全天候左上角工具列 (取代文字按鈕，純圖示) -->
        <div id="quick-tools">
            <button class="tool-btn" onclick="toggleMenu()" title="展開系統選單">☰</button>
            <button class="tool-btn" onclick="undo()" id="btn-undo" title="上一步" disabled>↩</button>
            <button class="tool-btn" onclick="redo()" id="btn-redo" title="下一步" disabled>↪</button>
            <button class="tool-btn" onclick="resetViews()" title="視角與比例回正">⌂</button>
        </div>

        <!-- 側邊系統選單 (內含兩種維度的 UI，動態顯示) -->
        <div id="sidebar">
            <div class="flex justify-between items-center p-4 border-b border-gray-700 bg-gray-900">
                <h2 class="text-lg font-bold text-white flex items-center gap-2" id="sidebar-title">🏠 裝潢模式選單</h2>
                <button onclick="toggleMenu()" class="text-gray-400 hover:text-white text-2xl font-bold">✕</button>
            </div>
            
            <div class="flex-1 overflow-y-auto p-4 flex flex-col gap-4">
                
                <!-- 【大宇宙】裝潢維度專屬選項 -->
                <div id="room-tools" class="flex flex-col gap-4">
                    <div class="bg-blue-900/30 border border-blue-800 p-3 rounded">
                        <p class="text-[11px] text-blue-300">💡 在畫面上「雙擊系統櫃」，即可進入內部編輯模式，自訂層板與公仔。在2D或3D畫面皆可操作。</p>
                    </div>
                    
                    <div>
                        <h3 class="text-xs font-bold text-gray-400 mb-2 border-b border-gray-700 pb-1">🪑 裝潢家具庫</h3>
                        <div class="grid grid-cols-2 gap-2">
                            <button onclick="addRoomObj('cabinet')" class="bg-amber-900/60 hover:bg-amber-800 text-amber-400 text-xs py-2.5 rounded border border-amber-700 col-span-2 font-bold shadow-md">+ 新增一座空系統櫃</button>
                            <button onclick="addRoomObj('wall')" class="bg-gray-800 text-xs py-2 rounded border border-gray-600">牆面</button>
                            <button onclick="addRoomObj('floor')" class="bg-gray-800 text-xs py-2 rounded border border-gray-600">木地板</button>
                            <button onclick="addRoomObj('sofa')" class="bg-gray-800 text-xs py-2 rounded border border-gray-600">沙發</button>
                            <button onclick="addRoomObj('bed')" class="bg-gray-800 text-xs py-2 rounded border border-gray-600">雙人床</button>
                            <button onclick="addRoomObj('tv')" class="bg-gray-800 text-xs py-2 rounded border border-gray-600">電視牆</button>
                            <button onclick="addRoomObj('plant')" class="bg-gray-800 text-xs py-2 rounded border border-gray-600 text-green-400">盆栽</button>
                        </div>
                    </div>
                    
                    <div class="mt-auto border-t border-gray-700 pt-4">
                        <button onclick="load54ToysUltimate()" class="w-full bg-purple-700 hover:bg-purple-600 text-white text-[11px] py-2.5 rounded font-bold mb-3 shadow border border-purple-500">
                            ✨ 一鍵載入：旗艦版 3 櫃體 + 54件公仔
                        </button>
                        <button onclick="exportHTML()" class="w-full py-2.5 bg-gray-700 hover:bg-gray-600 text-gray-200 font-bold rounded text-[11px] border border-gray-500 shadow-md">
                            💾 匯出 HTML 原始碼 (獨立存檔)
                        </button>
                    </div>
                </div>

                <!-- 【小宇宙】系統櫃編輯維度專屬選項 -->
                <div id="cabinet-tools" class="hidden flex-col h-full">
                    <div class="bg-emerald-900/30 border border-emerald-800 p-3 rounded mb-4">
                        <p class="text-[11px] text-emerald-300">⚙️ 現在處於櫃體內部。畫面翻轉為「立面視角」。編輯完畢後請點擊下方按鈕套用至裝潢中。</p>
                    </div>
                    
                    <!-- 核心：封裝並返回 -->
                    <button onclick="exitCabinetMode()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3.5 rounded mb-4 shadow-lg border border-emerald-400 flex items-center justify-center gap-2 text-sm">
                        <span>💾</span> 完成客製化，套用並返回裝潢
                    </button>

                    <h3 class="text-xs font-bold text-gray-400 mb-2 border-b border-gray-700 pb-1 mt-2">🧸 專屬玩具管理</h3>
                    <button onclick="addCabinetToy()" class="w-full bg-blue-600 hover:bg-blue-500 text-white text-xs py-2.5 rounded font-bold mb-3 shadow border border-blue-500">+ 新增公仔至此櫃</button>
                    
                    <div class="flex-1 bg-gray-950 border border-gray-700 rounded-lg p-2 flex flex-col mb-4 min-h-[150px]">
                        <span class="text-[10px] text-gray-500 text-center block mb-2">▼ 暫存區 (可拖曳至右側) ▼</span>
                        <div id="toy-bin" class="flex-1 overflow-y-auto grid grid-cols-2 gap-2 content-start min-h-[100px]"></div>
                    </div>
                </div>

            </div>
        </div>
        <div id="sidebar-overlay" onclick="toggleMenu()"></div>

        <!-- 3D 視圖區 -->
        <div id="view-3d"></div>

        <!-- 2D 平面圖區 -->
        <div id="view-2d">
            <div id="floor-plan-container">
                <div id="camera-marker">
                    <div class="dot"></div>
                    <div class="cone"></div>
                </div>
            </div>
        </div>
        
        <div id="mode-indicator" class="mode-badge">🏠 總裝潢空間模式 (俯視)</div>
    </div>

    <!-- 統一編輯面板 (雙擊跳出) -->
    <div id="edit-modal" class="fixed inset-0 bg-black/80 hidden items-center justify-center backdrop-blur-sm px-4" style="z-index: 10000;">
        <div class="bg-gray-900 border border-gray-600 rounded-xl p-5 max-w-sm w-full shadow-2xl max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-4 border-b border-gray-700 pb-2">
                <h3 class="text-lg font-bold text-amber-500" id="edit-title">⚙️ 編輯屬性</h3>
                <button onclick="closeModal('edit-modal')" class="text-gray-400 hover:text-white font-bold text-xl">✕</button>
            </div>
            
            <input type="hidden" id="edit-id">
            <div class="space-y-4 mb-6">
                <div><label class="block text-gray-400 text-xs mb-1 font-bold">名稱</label><input type="text" id="edit-name" class="w-full bg-black text-white border border-gray-700 rounded px-3 py-2 text-sm focus:border-amber-500 focus:outline-none"></div>
                
                <div class="grid grid-cols-3 gap-3">
                    <div><label class="block text-gray-400 text-xs mb-1 font-bold">面寬 (W)</label><input type="number" id="edit-w" class="w-full bg-black text-white border border-gray-700 rounded px-2 py-2 text-sm text-center"></div>
                    <div><label class="block text-gray-400 text-xs mb-1 font-bold">高度 (H)</label><input type="number" id="edit-h" class="w-full bg-black text-white border border-gray-700 rounded px-2 py-2 text-sm text-center"></div>
                    <div><label class="block text-gray-400 text-xs mb-1 font-bold">深度 (D)</label><input type="number" id="edit-d" class="w-full bg-black text-white border border-gray-700 rounded px-2 py-2 text-sm text-center"></div>
                </div>
                
                <!-- 裝潢模式座標 -->
                <div class="grid grid-cols-3 gap-3" id="edit-pos-room">
                    <div><label class="block text-gray-400 text-xs mb-1 font-bold">左右 (X)</label><input type="number" id="edit-x" class="w-full bg-black text-white border border-gray-700 rounded px-2 py-2 text-sm text-center"></div>
                    <div><label class="block text-gray-400 text-xs mb-1 font-bold">前後 (Z)</label><input type="number" id="edit-z" class="w-full bg-black text-white border border-gray-700 rounded px-2 py-2 text-sm text-center"></div>
                    <div><label class="block text-gray-400 text-xs mb-1 font-bold">旋轉角度</label><input type="number" id="edit-rot" class="w-full bg-black text-white border border-gray-700 rounded px-2 py-2 text-sm text-center"></div>
                </div>
                
                <!-- 櫃體內部座標 -->
                <div class="grid grid-cols-2 gap-3 hidden" id="edit-pos-cab">
                    <div><label class="block text-gray-400 text-xs mb-1 font-bold">左右 (X)</label><input type="number" id="edit-cx" class="w-full bg-black text-white border border-gray-700 rounded px-2 py-2 text-sm text-center"></div>
                    <div><label class="block text-gray-400 text-xs mb-1 font-bold">離地高 (Y)</label><input type="number" id="edit-cy" class="w-full bg-black text-white border border-gray-700 rounded px-2 py-2 text-sm text-center"></div>
                </div>

                <!-- 內部層板管理 (僅系統櫃有) -->
                <div id="edit-shelves" class="hidden mt-4 p-3 bg-gray-800 border border-gray-700 rounded-lg">
                    <label class="block text-amber-500 text-xs font-bold mb-2">📐 內部層板淨高 (由下而上)</label>
                    <div id="shelves-list" class="space-y-2 max-h-40 overflow-y-auto pr-2"></div>
                    <button onclick="addShelf()" class="mt-3 w-full text-xs bg-gray-700 hover:bg-gray-600 py-2 rounded border border-gray-500 text-white shadow-sm">+ 往上加一層</button>
                </div>
            </div>
            
            <div class="flex flex-col space-y-3 border-t border-gray-700 pt-4">
                <button onclick="document.getElementById('img-upload').click()" class="w-full py-2.5 bg-blue-900/50 hover:bg-blue-600 text-blue-300 hover:text-white font-bold rounded text-sm border border-blue-800 transition-colors flex justify-center gap-2"><span>🖼️</span> 上傳真實材質</button>
                <div class="flex gap-2">
                    <button onclick="saveObjectEdit()" class="flex-1 py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded text-sm shadow-lg">💾 儲存</button>
                    <button onclick="deleteObject()" class="flex-1 py-2.5 border border-red-800 bg-red-900/30 text-red-400 hover:bg-red-600 font-bold rounded text-sm" id="btn-delete">✖ 刪除</button>
                </div>
            </div>
        </div>
    </div>
    <input type="file" id="img-upload" accept="image/*" class="hidden">

    <!-- 狀態儲存庫 -->
    <script id="saved-state" type="application/json">{}</script>

    <script>
        // --- 核心變數與雙維度狀態 ---
        let appMode = 'ROOM'; // 'ROOM' (裝潢大宇宙) | 'CABINET' (系統櫃小宇宙)
        let editingCabinetId = null; // 在 CABINET 模式下，當前編輯的櫃體 ID
        
        let roomData = { objects: [] }; // 唯一資料源
        let historyStack = []; let redoStack = [];
        
        const SCALE_2D = 2; // 2D 畫布比例 (1cm = 2px)
        let zoom2D = 1; let panX = 0; let panY = 0;
        
        let scene, camera, renderer, orbitControls, dragControls;
        let draggableMeshes = [];
        let raycaster = new THREE.Raycaster();
        let mouse = new THREE.Vector2();
        const textureLoader = new THREE.TextureLoader();
        let activeEditId = null;

        // --- 輔助函式 ---
        const generateId = (prefix) => prefix + '_' + Math.random().toString(36).substr(2, 9);
        const getEl = (id) => document.getElementById(id);
        const openModal = (id) => { getEl(id).classList.remove('hidden'); getEl(id).classList.add('flex'); };
        const closeModal = (id) => { getEl(id).classList.add('hidden'); getEl(id).classList.remove('flex'); };
        
        function toggleMenu() { getEl('sidebar').classList.toggle('open'); }

        // --- 歷史紀錄機制 ---
        function saveState() {
            historyStack.push(JSON.parse(JSON.stringify(roomData)));
            redoStack = [];
            if(historyStack.length > 30) historyStack.shift();
            getEl('btn-undo').disabled = historyStack.length <= 1;
            getEl('btn-redo').disabled = true;
        }
        function undo() {
            if(historyStack.length > 1) {
                redoStack.push(historyStack.pop());
                roomData = JSON.parse(JSON.stringify(historyStack[historyStack.length - 1]));
                getEl('btn-undo').disabled = historyStack.length <= 1;
                getEl('btn-redo').disabled = false;
                forceRebuildAll();
            }
        }
        function redo() {
            if(redoStack.length > 0) {
                const state = redoStack.pop();
                historyStack.push(JSON.parse(JSON.stringify(state)));
                roomData = JSON.parse(JSON.stringify(state));
                getEl('btn-undo').disabled = false;
                getEl('btn-redo').disabled = redoStack.length === 0;
                forceRebuildAll();
            }
        }

        // --- 視角與比例尺回正 (重要修正) ---
        function resetViews() {
            // 1. 3D 回正
            if(camera && orbitControls) {
                if(appMode === 'ROOM') {
                    camera.position.set(0, 500, 600);
                    orbitControls.target.set(0, 0, 0);
                } else {
                    camera.position.set(0, 150, 350);
                    orbitControls.target.set(0, 100, 0);
                }
                orbitControls.update();
            }
            // 2. 2D 回正
            panX = 0; panY = 0; zoom2D = 1;
            update2DTransform();
        }
        
        function update2DTransform() {
            const container = getEl('floor-plan-container');
            if(container) container.style.transform = `translate(calc(-50% + ${panX}px), calc(-50% + ${panY}px)) scale(${zoom2D})`;
        }

        // --- 維度切換系統 (Room <-> Cabinet) ---
        function enterCabinetMode(id) {
            appMode = 'CABINET';
            editingCabinetId = id;
            
            getEl('room-tools').classList.add('hidden');
            getEl('cabinet-tools').classList.remove('hidden');
            getEl('cabinet-tools').classList.add('flex');
            
            getEl('sidebar-title').innerText = '🛠️ 系統櫃編輯選單';
            getEl('mode-indicator').innerText = '🛠️ 內部立面編輯模式 (正視圖)';
            getEl('mode-indicator').style.color = '#10b981';
            getEl('mode-indicator').style.borderColor = '#10b981';
            
            getEl('camera-marker').style.display = 'none'; // 隱藏裝潢視角點
            
            if(!getEl('sidebar').classList.contains('open')) toggleMenu(); // 幫使用者打開選單看暫存區
            
            forceRebuildAll();
            resetViews();
        }

        function exitCabinetMode() {
            appMode = 'ROOM';
            editingCabinetId = null;
            
            getEl('cabinet-tools').classList.add('hidden');
            getEl('cabinet-tools').classList.remove('flex');
            getEl('room-tools').classList.remove('hidden');
            
            getEl('sidebar-title').innerText = '🏠 裝潢模式選單';
            getEl('mode-indicator').innerText = '🏠 總裝潢空間模式 (俯視)';
            getEl('mode-indicator').style.color = '#d97706';
            getEl('mode-indicator').style.borderColor = '#d97706';
            
            getEl('camera-marker').style.display = 'block';
            
            toggleMenu(); // 收合選單
            forceRebuildAll();
            resetViews();
        }

        // --- 1. Three.js 引擎初始化 ---
        function init3D() {
            const container = getEl('view-3d');
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x111111);
            
            camera = new THREE.PerspectiveCamera(50, container.clientWidth / container.clientHeight, 1, 5000);
            renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);
            
            orbitControls = new THREE.OrbitControls(camera, renderer.domElement);
            orbitControls.enableDamping = true;
            
            // 燈光
            scene.add(new THREE.AmbientLight(0xffffff, 0.7));
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(300, 600, 400); dirLight.castShadow = true;
            dirLight.shadow.camera.left = -500; dirLight.shadow.camera.right = 500;
            dirLight.shadow.camera.top = 500; dirLight.shadow.camera.bottom = -500;
            scene.add(dirLight);
            
            // 網格底板
            const grid = new THREE.GridHelper(2000, 100, 0x444444, 0x222222); 
            grid.position.y = -0.1; scene.add(grid);

            // 拖曳控制器
            dragControls = new THREE.DragControls(draggableMeshes, camera, renderer.domElement);
            dragControls.addEventListener('dragstart', (e) => { orbitControls.enabled = false; e.object.material.opacity = 0.5; e.object.material.transparent = true; });
            dragControls.addEventListener('drag', (e) => {
                const mesh = e.object;
                const objData = findObjById(mesh.userData.id);
                if(!objData) return;
                
                if (appMode === 'ROOM') {
                    // 裝潢模式：只能在地上滑動 (X, Z)，Y固定
                    mesh.position.y = (objData.y || 0) + objData.h/2;
                    syncTo2D(objData.id, mesh.position.x, mesh.position.z);
                } else if (appMode === 'CABINET') {
                    // 立面模式：只能移動內部玩具 (X, Y)，Z鎖定在櫃內
                    if(objData.type !== 'toy') return;
                    mesh.position.z = 0; 
                    syncTo2D(objData.id, mesh.position.x, mesh.position.y - objData.h/2);
                }
            });
            dragControls.addEventListener('dragend', (e) => { 
                orbitControls.enabled = true; 
                e.object.material.opacity = 1.0; e.object.material.transparent = false;
                
                const mesh = e.object;
                const objData = findObjById(mesh.userData.id);
                if(objData) {
                    objData.x = mesh.position.x;
                    if(appMode === 'ROOM') objData.z = mesh.position.z;
                    else if(appMode === 'CABINET') objData.y = mesh.position.y - objData.h/2;
                }
                saveState(); 
            });

            // 觸控與雙擊事件 (Raycasting)
            let lastTap = 0;
            renderer.domElement.addEventListener('pointerup', (e) => {
                if (dragControls._dragging) return;
                const now = Date.now();
                if (now - lastTap < 350) {
                    const rect = renderer.domElement.getBoundingClientRect();
                    mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
                    mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
                    raycaster.setFromCamera(mouse, camera);
                    
                    const intersects = raycaster.intersectObjects(draggableMeshes, true);
                    if (intersects.length > 0) {
                        let target = intersects[0].object;
                        while(target.parent && target.parent.type !== 'Scene' && !target.userData.id) target = target.parent;
                        if(target.userData.id) handleDoubleClick(target.userData.id);
                    }
                    lastTap = 0;
                } else { lastTap = now; }
            });

            animate();
        }

        function animate() {
            requestAnimationFrame(animate);
            if(orbitControls) orbitControls.update();
            if(renderer && scene && camera) renderer.render(scene, camera);
            if(appMode === 'ROOM') syncCameraTo2D();
        }

        // --- 2. 2D 畫布與攝影機聯動 ---
        let isDraggingCamera = false;
        
        function syncCameraTo2D() {
            const camMarker = getEl('camera-marker');
            if (!camMarker || isDraggingCamera || appMode !== 'ROOM') return;
            camMarker.style.left = (camera.position.x * SCALE_2D) + 'px';
            camMarker.style.top = (camera.position.z * SCALE_2D) + 'px';
            const angle = Math.atan2(orbitControls.target.z - camera.position.z, orbitControls.target.x - camera.position.x) * (180 / Math.PI) + 90;
            camMarker.style.transform = `translate(-50%, -50%) rotate(${angle}deg)`;
        }

        document.addEventListener('DOMContentLoaded', () => {
            // 綁定攝影機標記拖曳
            const camMarker = getEl('camera-marker');
            if(camMarker) {
                camMarker.addEventListener('pointerdown', (e) => { isDraggingCamera = true; e.stopPropagation(); });
            }
            
            // 綁定畫布平移與縮放
            const view2d = getEl('view-2d');
            if(view2d) {
                view2d.addEventListener('pointerdown', (e) => {
                    if (e.target.id === 'view-2d' || e.target.id === 'floor-plan-container') { 
                        isPanning2D = true; panStartX = e.clientX - panX; panStartY = e.clientY - panY; 
                    }
                });
                view2d.addEventListener('wheel', (e) => {
                    e.preventDefault();
                    zoom2D += e.deltaY * -0.001;
                    zoom2D = Math.min(Math.max(0.3, zoom2D), 3);
                    update2DTransform();
                }, { passive: false });
            }
        });

        let isPanning2D = false, panStartX, panStartY;
        document.addEventListener('pointermove', (e) => {
            if (isDraggingCamera && appMode === 'ROOM') {
                const fpRect = getEl('view-2d').getBoundingClientRect();
                const cx = ((e.clientX - fpRect.left - fpRect.width/2 - panX) / zoom2D) / SCALE_2D;
                const cz = ((e.clientY - fpRect.top - fpRect.height/2 - panY) / zoom2D) / SCALE_2D;
                const dx = orbitControls.target.x - camera.position.x;
                const dz = orbitControls.target.z - camera.position.z;
                camera.position.x = cx; camera.position.z = cz;
                orbitControls.target.set(cx + dx, orbitControls.target.y, cz + dz);
            }
            if (isPanning2D) { 
                panX = e.clientX - panStartX; panY = e.clientY - panStartY; update2DTransform(); 
            }
        });
        document.addEventListener('pointerup', () => { isDraggingCamera = false; isPanning2D = false; });

        // --- 3. 核心資料與渲染 ---
        
        function addRoomObj(type) {
            const id = generateId('rm');
            let w=100, h=100, d=100, color='#ffffff', name='物件', y=0;

            if(type === 'cabinet') { w=75; h=235; d=30; color='#3d2b1f'; name='系統櫃'; }
            else if(type === 'wall') { w=300; h=280; d=15; color='#f3f4f6'; name='牆面'; }
            else if(type === 'floor') { w=400; h=2; d=400; color='#d1d5db'; name='木地板'; y=-1;}
            else if(type === 'sofa') { w=200; h=80; d=90; color='#3b82f6'; name='沙發'; }
            else if(type === 'bed') { w=150; h=50; d=200; color='#e5e7eb'; name='雙人床'; }
            else if(type === 'tv') { w=120; h=140; d=30; color='#1f2937'; name='電視牆'; }
            else if(type === 'plant') { w=40; h=120; d=40; color='#22c55e'; name='盆栽'; }

            const obj = { id, type, name, w, h, d, x:0, y, z:0, rot:0, color, img:null };
            
            // 系統櫃專屬結構
            if(type === 'cabinet') {
                obj.shelves = [{h:65}, {h:35}, {h:35}, {h:35}, {h:25}, {h:20}];
                obj.toys = [];
            }
            
            roomData.objects.push(obj);
            saveState(); forceRebuildAll();
        }

        function addCabinetToy() {
            if(appMode !== 'CABINET' || !editingCabinetId) return;
            const cabinet = roomData.objects.find(o => o.id === editingCabinetId);
            if(!cabinet) return;
            
            const toy = { id: generateId('toy'), type: 'toy', name: '新公仔', w: 15, h: 20, d: 15, x: 0, y: 0, z: 0, color: '#ef4444', img: null, inBin: true };
            cabinet.toys.push(toy);
            saveState(); forceRebuildAll();
        }

        // 清理記憶體與重建世界
        function forceRebuildAll() {
            // 清理 3D 記憶體
            draggableMeshes.forEach(m => {
                scene.remove(m);
                if(m.geometry) m.geometry.dispose();
                if(m.material) {
                    if(Array.isArray(m.material)) m.material.forEach(mat => { if(mat.map) mat.map.dispose(); mat.dispose(); });
                    else { if(m.material.map) m.material.map.dispose(); m.material.dispose(); }
                }
            });
            draggableMeshes.length = 0;
            
            // 清理 2D
            const fpContainer = getEl('floor-plan-container');
            const cam = getEl('camera-marker');
            fpContainer.innerHTML = ''; 
            if(cam) fpContainer.appendChild(cam);
            getEl('toy-bin').innerHTML = '';
            
            if (appMode === 'ROOM') {
                // 大宇宙渲染
                roomData.objects.forEach(obj => renderObject(obj));
            } else if (appMode === 'CABINET' && editingCabinetId) {
                // 小宇宙渲染
                const cab = roomData.objects.find(o => o.id === editingCabinetId);
                if (cab) {
                    renderObject(cab, true); // true: 展開模式 (不加上外層 Group transform)
                    cab.toys.forEach(toy => {
                        if (toy.inBin) renderBinItem(toy);
                        else renderObject(toy);
                    });
                }
            }
        }

        function renderObject(data, isExpandedCabinet = false) {
            const mat = data.img ? new THREE.MeshStandardMaterial({map: textureLoader.load(data.img)}) : new THREE.MeshStandardMaterial({color: data.color});
            let mesh;
            
            // --- 1. 3D 建構 ---
            if (data.type === 'cabinet') {
                mesh = new THREE.Group();
                const t = 2.5; // 板厚
                mesh.add(new THREE.Mesh(new THREE.BoxGeometry(t, data.h, data.d), mat).translateX(-data.w/2+t/2));
                mesh.add(new THREE.Mesh(new THREE.BoxGeometry(t, data.h, data.d), mat).translateX(data.w/2-t/2));
                mesh.add(new THREE.Mesh(new THREE.BoxGeometry(data.w, t, data.d), mat).translateY(data.h/2-t/2));
                mesh.add(new THREE.Mesh(new THREE.BoxGeometry(data.w, t, data.d), mat).translateY(-data.h/2+t/2));
                mesh.add(new THREE.Mesh(new THREE.BoxGeometry(data.w, data.h, t), mat).translateZ(-data.d/2+t/2));
                
                let currY = -data.h/2 + t;
                data.shelves.forEach(shelf => {
                    currY += parseFloat(shelf.h);
                    if(currY < data.h/2 - t) mesh.add(new THREE.Mesh(new THREE.BoxGeometry(data.w - t*2, t, data.d), mat).translateY(currY));
                });
                
                // 如果在 ROOM 模式，要把裡面的玩具也畫出來裝進這個 Group
                if (!isExpandedCabinet && data.toys) {
                    data.toys.filter(t => !t.inBin).forEach(toy => {
                        const tMat = toy.img ? new THREE.MeshStandardMaterial({map: textureLoader.load(toy.img)}) : new THREE.MeshStandardMaterial({color: toy.color});
                        const tMesh = new THREE.Mesh(new THREE.BoxGeometry(toy.w, toy.h, toy.d), tMat);
                        tMesh.position.set(toy.x, toy.y + toy.h/2, toy.z); // 玩具相對櫃體的座標
                        tMesh.castShadow = true;
                        mesh.add(tMesh);
                    });
                }
            } else if (data.type === 'sofa') {
                mesh = new THREE.Group();
                mesh.add(new THREE.Mesh(new THREE.BoxGeometry(data.w, data.h*0.4, data.d), mat).translateY(-data.h*0.3));
                mesh.add(new THREE.Mesh(new THREE.BoxGeometry(data.w, data.h, data.d*0.2), mat).translateZ(-data.d*0.4));
            } else {
                mesh = new THREE.Mesh(new THREE.BoxGeometry(data.w, data.h, data.d), mat);
            }

            mesh.traverse(child => { if (child.isMesh) { child.castShadow = true; child.receiveShadow = true; } });
            mesh.userData = { id: data.id };
            
            // 座標與拖曳陣列處理
            if (appMode === 'ROOM') {
                mesh.position.set(data.x, data.y + data.h/2, data.z);
                mesh.rotation.y = THREE.MathUtils.degToRad(data.rot || 0);
                draggableMeshes.push(mesh);
            } else if (appMode === 'CABINET') {
                if (data.type === 'cabinet') {
                    mesh.position.set(0, data.h/2, 0); // 立面櫃體置中不動
                } else if (data.type === 'toy') {
                    mesh.position.set(data.x, data.y + data.h/2, data.z);
                    draggableMeshes.push(mesh); // 玩具可拖曳
                }
            }
            scene.add(mesh);

            // --- 2. 2D DOM 建構 ---
            const div = document.createElement('div');
            div.id = '2d_' + data.id;
            div.className = 'map-item';
            div.style.backgroundColor = data.img ? '#333' : data.color;
            if(data.img) div.style.backgroundImage = `url(${data.img})`;
            
            if (appMode === 'ROOM') {
                // 俯視平面 (X-Z)
                div.style.width = (data.w * SCALE_2D) + 'px';
                div.style.height = (data.d * SCALE_2D) + 'px';
                div.style.left = (data.x * SCALE_2D) + 'px';
                div.style.top = (data.z * SCALE_2D) + 'px';
                div.style.transform = `translate(-50%, -50%) rotate(${data.rot || 0}deg)`;
                div.innerHTML = `<span style="background:rgba(0,0,0,0.6); padding:2px 4px; border-radius:3px;">${data.name}</span>`;
            } else {
                // 立面圖 (X-Y)
                if (data.type === 'cabinet') {
                    div.style.width = (data.w * SCALE_2D) + 'px';
                    div.style.height = (data.h * SCALE_2D) + 'px';
                    div.style.left = '0px';
                    div.style.top = (-data.h/2) * SCALE_2D + 'px';
                    div.style.border = `4px solid ${data.color}`;
                    div.style.backgroundColor = 'transparent';
                    div.style.zIndex = '0';
                    div.style.pointerEvents = 'none'; // 滑鼠穿透抓玩具
                    
                    let currY = -data.h/2;
                    data.shelves.forEach(shelf => {
                        currY += parseFloat(shelf.h);
                        if(currY < data.h/2) {
                            const line = document.createElement('div');
                            line.style.position = 'absolute'; line.style.width = '100%'; line.style.height = '4px';
                            line.style.backgroundColor = data.color; line.style.bottom = (currY + data.h/2) * SCALE_2D + 'px';
                            div.appendChild(line);
                        }
                    });
                } else if (data.type === 'toy') {
                    div.style.width = (data.w * SCALE_2D) + 'px';
                    div.style.height = (data.h * SCALE_2D) + 'px';
                    div.style.left = (data.x * SCALE_2D) + 'px';
                    div.style.top = (-data.y - data.h/2) * SCALE_2D + 'px';
                    div.innerText = data.name;
                    div.style.alignItems = 'flex-end'; div.style.paddingBottom = '2px';
                    div.style.zIndex = '10';
                }
            }

            // 2D 拖曳綁定
            if (!(appMode === 'CABINET' && data.type === 'cabinet')) {
                let isDragging = false, startX, startY, origLeft, origTop;
                div.addEventListener('pointerdown', (e) => {
                    isDragging = true; startX = e.clientX; startY = e.clientY;
                    origLeft = parseFloat(div.style.left); origTop = parseFloat(div.style.top);
                    if(orbitControls) orbitControls.enabled = false; 
                    div.setPointerCapture(e.pointerId); e.stopPropagation();
                });
                div.addEventListener('pointermove', (e) => {
                    if(!isDragging) return;
                    const newX = (origLeft + (e.clientX - startX) / zoom2D) / SCALE_2D;
                    const newY_or_Z = (origTop + (e.clientY - startY) / zoom2D) / SCALE_2D;
                    div.style.left = (newX * SCALE_2D) + 'px'; div.style.top = (newY_or_Z * SCALE_2D) + 'px';
                    mesh.position.x = newX;
                    if (appMode === 'ROOM') mesh.position.z = newY_or_Z;
                    else mesh.position.y = -newY_or_Z;
                });
                div.addEventListener('pointerup', (e) => {
                    isDragging = false; if(orbitControls) orbitControls.enabled = true;
                    if(appMode === 'ROOM') { data.x = mesh.position.x; data.z = mesh.position.z; } 
                    else { data.x = mesh.position.x; data.y = mesh.position.y - data.h/2; }
                    saveState();
                });
            }

            // 觸控雙擊 (開啟屬性) - 對 2D DOM
            let touchTimer = 0;
            div.addEventListener('pointerup', (e) => {
                const now = Date.now();
                if(now - touchTimer < 350) handleDoubleClick(data.id);
                else touchTimer = now;
            });

            getEl('floor-plan-container').appendChild(div);
        }

        function renderBinItem(toy) {
            const btn = document.createElement('div');
            btn.className = 'bg-gray-800 text-white text-xs p-2 rounded cursor-pointer border border-gray-600 hover:border-amber-500 truncate text-center shadow';
            btn.innerText = toy.name;
            let touchTimer = 0;
            btn.addEventListener('pointerup', (e) => {
                const now = Date.now();
                if(now - touchTimer < 350) handleDoubleClick(toy.id);
                else touchTimer = now;
            });
            getEl('toy-bin').appendChild(btn);
        }

        function syncTo2D(id, x, val) {
            const div = getEl('2d_' + id);
            if(div) {
                div.style.left = (x * SCALE_2D) + 'px';
                div.style.top = (appMode === 'ROOM' ? val : -val) * SCALE_2D + 'px';
            }
        }

        // --- 4. 尋找與編輯面板 (雙擊事件) ---
        function findObjById(id) {
            let obj = roomData.objects.find(o => o.id === id);
            if (obj) return obj;
            for(let c of roomData.objects) {
                if(c.type === 'cabinet' && c.toys) {
                    obj = c.toys.find(t => t.id === id);
                    if (obj) return obj;
                }
            }
            return null;
        }
        function findCabinetByToyId(id) {
            return roomData.objects.find(c => c.type === 'cabinet' && c.toys && c.toys.some(t => t.id === id));
        }

        function handleDoubleClick(id) {
            const obj = findObjById(id);
            if(!obj) return;
            
            // 【關鍵】裝潢模式下雙擊系統櫃，直接進入櫃體編輯模式
            if (appMode === 'ROOM' && obj.type === 'cabinet') {
                enterCabinetMode(obj.id);
                return;
            }

            // 開啟屬性面板
            activeEditId = id;
            getEl('edit-title').innerText = `⚙️ 編輯 [${obj.name}]`;
            ['name','w','h','d'].forEach(k => { if(getEl(`edit-${k}`)) getEl(`edit-${k}`).value = obj[k] !== undefined ? obj[k] : 0; });
            
            if (appMode === 'ROOM') {
                getEl('edit-pos-room').classList.remove('hidden'); getEl('edit-pos-cab').classList.add('hidden');
                getEl('edit-x').value = obj.x || 0; getEl('edit-z').value = obj.z || 0; getEl('edit-rot').value = obj.rot || 0;
                getEl('edit-shelves').classList.add('hidden');
            } else {
                getEl('edit-pos-room').classList.add('hidden'); getEl('edit-pos-cab').classList.remove('hidden');
                getEl('edit-cx').value = obj.x || 0; getEl('edit-cy').value = obj.y || 0;
                
                // 系統櫃層板管理
                if(obj.type === 'cabinet') {
                    getEl('edit-shelves').classList.remove('hidden');
                    const list = getEl('shelves-list'); list.innerHTML = '';
                    obj.shelves.forEach((s, idx) => {
                        list.innerHTML += `<div class="flex items-center gap-2 mb-1"><span class="text-white text-[10px] w-8">L${idx+1}</span><input type="number" value="${s.h}" class="flex-1 bg-black text-white border border-gray-600 rounded px-1 py-1 text-xs text-center" onchange="updateShelf(${idx}, this.value)"><button onclick="removeShelf(${idx})" class="text-red-500 text-xs px-2 py-1 bg-gray-900 rounded border border-red-900">刪</button></div>`;
                    });
                } else { getEl('edit-shelves').classList.add('hidden'); }
            }
            
            // 刪除按鈕邏輯
            if (obj.type === 'toy') { getEl('btn-delete').innerText = obj.inBin ? '✖ 徹底刪除' : '📥 退回暫存'; } 
            else { getEl('btn-delete').innerText = '✖ 刪除物件'; }

            openModal('edit-modal');
        }

        function updateShelf(idx, val) { const obj = findObjById(activeEditId); if(obj) obj.shelves[idx].h = parseFloat(val); }
        function addShelf() { const obj = findObjById(activeEditId); if(obj) obj.shelves.push({h: 30}); handleDoubleClick(activeEditId); }
        function removeShelf(idx) { const obj = findObjById(activeEditId); if(obj) obj.shelves.splice(idx, 1); handleDoubleClick(activeEditId); }

        function saveObjectEdit() {
            if(!activeEditId) return;
            const obj = findObjById(activeEditId);
            
            obj.name = getEl('edit-name').value || '物件';
            ['w','h','d'].forEach(k => obj[k] = parseFloat(getEl(`edit-${k}`).value) || 0);
            
            if(appMode === 'ROOM') {
                obj.x = parseFloat(getEl('edit-x').value) || 0;
                obj.z = parseFloat(getEl('edit-z').value) || 0;
                obj.rot = parseFloat(getEl('edit-rot').value) || 0;
            } else {
                obj.x = parseFloat(getEl('edit-cx').value) || 0;
                obj.y = parseFloat(getEl('edit-cy').value) || 0;
                if(obj.type === 'toy') obj.inBin = false; // 存檔視同擺放入櫃
            }
            
            saveState(); forceRebuildAll(); closeModal('edit-modal');
        }

        function deleteObject() {
            if(!activeEditId) return;
            const obj = findObjById(activeEditId);
            
            if (obj.type === 'toy') {
                if (obj.inBin) {
                    const cab = findCabinetByToyId(activeEditId);
                    if(cab) cab.toys = cab.toys.filter(t => t.id !== activeEditId); // 徹底刪除
                } else {
                    obj.inBin = true; obj.x = 0; obj.y = 0; // 退回暫存
                }
            } else {
                if(confirm(`確定刪除 [${obj.name}] 嗎？`)) {
                    roomData.objects = roomData.objects.filter(o => o.id !== activeEditId);
                    if(appMode === 'CABINET' && obj.id === editingCabinetId) exitCabinetMode();
                }
            }
            saveState(); forceRebuildAll(); closeModal('edit-modal');
        }

        getEl('img-upload').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file || !activeEditId) return;
            const reader = new FileReader();
            reader.onload = function(event) {
                const obj = findObjById(activeEditId);
                obj.img = event.target.result;
                saveState(); forceRebuildAll(); closeModal('edit-modal');
            };
            reader.readAsDataURL(file); e.target.value = '';
        });

        // --- 5. 匯出 HTML ---
        function exportHTML() {
            getEl('saved-state').textContent = JSON.stringify(roomData);
            const htmlContent = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
            const blob = new Blob([htmlContent], { type: 'text/html' });
            const a = document.createElement('a'); a.href = URL.createObjectURL(blob); 
            a.download = 'Room_Planner_Ultimate.html'; a.click();
        }
